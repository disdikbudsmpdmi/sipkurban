<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SIPKURBAN RT — Portal Iuran & Manajemen Kurban Warga</title>
  <meta name="theme-color" content="#0D47A1" />
  <meta name="description" content="Sistem Informasi Pengelolaan Iuran Kurban Lingkungan RT Berbasis Web & PWA" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            canvas: '#F4F7FE',
            brand: { DEFAULT: '#0D47A1', dark: '#0A3D91', light: '#1976D2' }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons & Chart.js -->
  <script src="https://unpkg.com/lucide@0.469.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Indikator loading global -->
  <div id="loading-bar"></div>

  <!-- FIXED FULL-PAGE WRAPPER -->
  <div id="sipkurban-root-wrapper">
    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[100005] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Container Utama Aplikasi (diisi oleh JS) -->
    <div id="app-container" class="min-h-screen flex flex-col w-full"></div>

    <!-- Modal Global Container -->
    <div id="modal-container" class="fixed inset-0 z-[100002] hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 overflow-y-auto"></div>
  </div>

  <!-- Skrip aplikasi (urutan penting: berbagi scope global) -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/laporan.js"></script>
  <script src="js/pages/peserta.js"></script>
  <script src="js/pages/iuran.js"></script>
  <script src="js/pages/jadwal.js"></script>
  <script src="js/pages/pengumuman.js"></script>
  <script src="js/pages/profil.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
